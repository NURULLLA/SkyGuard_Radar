<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skyguard Radar</title>
<meta name="theme-color" content="#0b1017">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Skyguard">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="icon" href="/static/favicon.png">
<link rel="manifest" href="/manifest.webmanifest">
<style>
  :root{
    --bg:#0b1017; --panel:#131a24; --panel-2:#182231; --line:#243044;
    --text:#e6edf6; --muted:#8b9bb4; --dim:#5f6f88;
    --accent:#3ea6ff; --ok:#2ecc8f; --warn:#f5a623; --bad:#ff5f57; --air:#a97bff;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
    --barh:60px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       -webkit-text-size-adjust:100%}

  /* ── header: brand, clock, refresh — one compact row ───────────────────── */
  header{position:sticky;top:0;z-index:20;background:rgba(11,16,23,.94);
         backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
         padding-top:env(safe-area-inset-top)}
  .bar{max-width:1280px;margin:0 auto;padding:10px 18px;
       display:flex;align-items:center;gap:12px}
  .brand{font-size:14.5px;font-weight:650;letter-spacing:.02em;
         display:flex;gap:7px;align-items:center;white-space:nowrap}
  .brand span{color:var(--accent)}
  .brand b{font-weight:inherit}
  .clock{margin-left:auto;font-family:var(--mono);font-size:15px;letter-spacing:.03em}
  .clock small{color:var(--dim);font-size:10px;margin-left:5px;letter-spacing:.08em}
  .icobtn{width:32px;height:32px;flex:0 0 32px;display:grid;place-items:center;
          background:var(--panel-2);border:1px solid var(--line);color:var(--muted);
          border-radius:9px;cursor:pointer;font-size:15px;line-height:1;padding:0}
  .icobtn:hover{border-color:var(--accent);color:var(--accent)}
  .icobtn[disabled]{opacity:.5;cursor:default}
  .icobtn.spin{animation:spin .9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ── plan / history switch ─────────────────────────────────────────────── */
  .seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:9px;
       padding:2px;gap:2px}
  .seg button{background:none;border:0;color:var(--muted);font:inherit;font-size:12.5px;
              font-weight:600;padding:5px 11px;border-radius:7px;cursor:pointer;white-space:nowrap}
  .seg button.on{background:var(--panel-2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
  .seg button:not(.on):hover{color:var(--accent)}

  /* ── history range picker ─────────────────────────────────────────────── */
  .hbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:16px 0 4px}
  .hbar label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim)}
  .hbar input[type=date]{background:var(--panel);border:1px solid var(--line);color:var(--text);
       border-radius:8px;padding:5px 8px;font:13px var(--mono);color-scheme:dark}
  .hbar input[type=date]:focus{outline:none;border-color:var(--accent)}
  .preset{background:var(--panel);border:1px solid var(--line);color:var(--muted);
          border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer}
  .preset:hover{border-color:var(--accent);color:var(--accent)}
  .preset.on{border-color:var(--accent);color:var(--text);background:var(--panel-2)}
  .hbar .sp{flex:1 1 auto}
  .hbar[hidden]{display:none}

  .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0 2px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
  .stat b{display:block;font-family:var(--mono);font-size:17px;font-weight:600}
  .stat span{font-size:11px;color:var(--dim);letter-spacing:.03em}
  .loading{opacity:.45;pointer-events:none;transition:opacity .2s}

  main{max-width:1280px;margin:0 auto;
       padding:4px 18px calc(var(--barh) + 28px + env(safe-area-inset-bottom))}

  /* ── day sections ─────────────────────────────────────────────────────── */
  .daybar{display:flex;align-items:baseline;gap:12px;margin:22px 0 8px;
          padding-bottom:8px;border-bottom:1px solid var(--line)}
  .daybar h3{margin:0;font-size:14px;font-weight:600;letter-spacing:.02em;white-space:nowrap}
  .lbl-short{display:none}
  .daybar span{font-size:12px;color:var(--dim)}

  .tablewrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{width:100%;border-collapse:collapse;min-width:560px}
  thead th{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);
           text-align:left;padding:0 12px 8px;font-weight:600;white-space:nowrap}
  tbody tr{border-top:1px solid var(--line)}
  tbody tr:hover{background:rgba(62,166,255,.045)}
  td{padding:11px 12px;vertical-align:top}
  .past td{opacity:.55}

  .fno{font-family:var(--mono);font-size:14px;font-weight:600;white-space:nowrap}
  .route{white-space:nowrap}
  .route b{font-family:var(--mono);font-size:13.5px;font-weight:600}
  .route .arrow{color:var(--dim);margin:0 7px}
  .route i{display:block;font-style:normal;font-size:11.5px;color:var(--muted);
           margin-top:2px;white-space:normal}
  .tcell{font-family:var(--mono);white-space:nowrap;font-size:14px}
  .tcell .plan{color:var(--muted)}
  .tcell .plan.struck{text-decoration:line-through;text-decoration-color:var(--dim);
                      font-size:12.5px;display:block}
  .tcell .real{display:block;font-weight:600}
  .chip{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:600;
        padding:2px 6px;border-radius:5px;margin-top:3px}
  .chip.ok{background:rgba(46,204,143,.14);color:var(--ok)}
  .chip.warn{background:rgba(245,166,35,.15);color:var(--warn)}
  .chip.bad{background:rgba(255,95,87,.15);color:var(--bad)}
  .chip.early{background:rgba(62,166,255,.14);color:var(--accent)}

  .state{font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;
         white-space:nowrap}
  .state.completed{color:var(--dim)}
  .state.airborne{color:var(--air)}
  .state.due{color:var(--warn)}
  .state.scheduled{color:var(--muted)}

  .crew{background:none;border:0;color:var(--accent);cursor:pointer;font-size:12.5px;padding:0}
  .crew:hover{text-decoration:underline}
  .crew.none{color:var(--dim);cursor:default;text-decoration:none}
  .crewlist{margin-top:6px;font-size:12px;color:var(--muted);line-height:1.7;display:none}
  .crewlist.open{display:block}
  .crewlist span{color:var(--dim);font-family:var(--mono);margin-right:7px}

  .empty{padding:50px 20px;text-align:center;color:var(--dim)}
  .err{background:rgba(255,95,87,.1);border:1px solid rgba(255,95,87,.35);
       border-radius:10px;padding:11px 14px;margin:14px 0 0;color:#ffb3ae;font-size:12.5px}
  .sync{font-size:11.5px;color:var(--dim);margin-top:22px}

  /* ── aircraft switcher: pinned to the bottom, thumb-reachable ─────────── */
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;
          background:rgba(11,16,23,.97);backdrop-filter:blur(12px);
          border-top:1px solid var(--line);
          padding:7px 12px calc(7px + env(safe-area-inset-bottom))}
  .tabbar .inner{max-width:1280px;margin:0 auto;display:flex;gap:6px;justify-content:center}
  .tab{flex:1 1 0;min-width:0;max-width:230px;
       background:var(--panel);border:1px solid var(--line);border-radius:10px;
       padding:7px 8px;cursor:pointer;text-align:center;color:var(--text);
       transition:border-color .15s,background .15s}
  .tab:hover{border-color:#33455f}
  .tab.on{border-color:var(--accent);background:var(--panel-2)}
  .tab b{display:block;font-family:var(--mono);font-size:12.5px;font-weight:600;
         letter-spacing:.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tab i{display:block;font-style:normal;font-size:10px;color:var(--dim);margin-top:1px;
         overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tab.ghost b{color:var(--muted);font-weight:500}
  .tab.on b{color:var(--text)}
  .dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:5px;
       vertical-align:middle;background:var(--air);box-shadow:0 0 0 3px rgba(169,123,255,.18)}

  /* ── cold start ───────────────────────────────────────────────────────── */
  .boot{position:fixed;inset:0;z-index:100;background:var(--bg);
        display:flex;align-items:center;justify-content:center;padding:28px;
        transition:opacity .35s ease}
  .boot.gone{opacity:0;pointer-events:none}
  .bootcard{max-width:330px;width:100%;text-align:center}
  .bootplane{font-size:44px;animation:float 2.6s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-9px) rotate(-2deg)}}
  .boottitle{font-size:17px;font-weight:650;margin:14px 0 6px;letter-spacing:.02em}
  .bootmsg{font-size:13.5px;color:var(--muted);min-height:20px}
  .bootbar{height:3px;border-radius:2px;background:var(--panel-2);overflow:hidden;margin:20px 0 16px}
  .bootbar i{display:block;height:100%;width:0;border-radius:2px;background:var(--accent);
             transition:width .9s linear}
  .boothint{font-size:11.5px;color:var(--dim);line-height:1.6}
  .btn{background:var(--panel-2);border:1px solid var(--line);color:var(--text);
       border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;margin-top:18px}
  .btn:hover{border-color:var(--accent);color:var(--accent)}

  @media(max-width:720px){
    .hide-sm{display:none !important}
    thead{display:none}          /* columns read fine without labels on a phone */
    table{min-width:0}
    td{padding:9px 7px}
    .fno,.route b,.tcell{font-size:12.5px}
    .route i{font-size:10.5px;line-height:1.35}
    .state{font-size:10px}
    .bar{padding:9px 14px}
    main{padding-left:14px;padding-right:14px}
    .brand{font-size:13.5px}
    .tab{max-width:none}
    .lbl-full{display:none}
    .lbl-short{display:inline}
    .daybar{margin-top:20px;gap:9px}
    .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
    .hbar label{flex:1 1 0;min-width:0}
    .hbar input[type=date]{width:100%;min-width:0}
    .hbar .sp{flex-basis:100%;height:0}
    .preset{flex:1 1 0}
    .seg button{padding:5px 9px}
  }
  @media(max-width:430px){
    .brand .txt{display:none}
    .clock small{display:none}
    .hbar label span{display:none}
  }
</style>
</head>
<body>

<div class="boot" id="boot">
  <div class="bootcard">
    <div class="bootplane">✈️</div>
    <div class="boottitle">Skyguard Radar</div>
    <div class="bootmsg" id="bootmsg">Подключение…</div>
    <div class="bootbar"><i id="bootbar"></i></div>
    <div class="boothint">Сервер засыпает после 15 минут простоя.<br>
      Первый запуск занимает до минуты.</div>
    <button class="btn" id="bootbtn" hidden onclick="boot()">Попробовать снова</button>
  </div>
</div>

<header>
  <div class="bar">
    <div class="brand">✈️<b class="txt">Skyguard <span>Radar</span></b></div>
    <div class="seg" role="tablist">
      <button id="m-plan" onclick="setMode('plan')">План</button>
      <button id="m-history" onclick="setMode('history')">История</button>
    </div>
    <div class="clock" id="clock">--:--:--<small>UTC</small></div>
    <button class="icobtn" id="refresh" onclick="refresh()" title="Обновить" aria-label="Обновить">⟳</button>
  </div>
</header>

<main>
  <div class="hbar" id="hbar" hidden>
    <label><span>с</span><input type="date" id="h-from" onchange="pickRange()"></label>
    <label><span>по</span><input type="date" id="h-to" onchange="pickRange()"></label>
    <span class="sp"></span>
    <button class="preset" data-days="1" onclick="preset(1)">Вчера</button>
    <button class="preset" data-days="7" onclick="preset(7)">7 дней</button>
    <button class="preset" data-days="30" onclick="preset(30)">30 дней</button>
  </div>
  <div id="err"></div>
  <div id="body"><div class="empty">Загрузка расписания…</div></div>
  <div class="sync" id="sync"></div>
</main>

<nav class="tabbar"><div class="inner" id="tabs"></div></nav>

<script>
const S = {
  mode: location.hash === '#history' ? 'history' : 'plan',
  tails: [], active: null, updated: 0, error: null, window: null,
  hist: { tails: [], from: null, to: null, error: null, loaded: false, busy: false, max: 62 },
};
const list = () => S.mode === 'history' ? S.hist.tails : S.tails;

const pad = n => String(n).padStart(2, '0');
const hhmm = iso => { if (!iso) return null; const d = new Date(iso);
                      return pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes()); };
const dur = m => m == null ? '—' : `${Math.floor(m / 60)}ч ${pad(m % 60)}м`;
const sleep = ms => new Promise(r => setTimeout(r, ms));

function clock() {
  const d = new Date();
  document.getElementById('clock').innerHTML =
    `${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}:${pad(d.getUTCSeconds())}<small>UTC</small>`;
}

/* 1 рейс / 2 рейса / 5 рейсов */
function plural(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return `${n} ${one}`;
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return `${n} ${few}`;
  return `${n} ${many}`;
}
const flightsWord = n => plural(n, 'рейс', 'рейса', 'рейсов');

const DOW       = ['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
const DOW_SHORT = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
const MONTH     = ['января','февраля','марта','апреля','мая','июня',
                   'июля','августа','сентября','октября','ноября','декабря'];
const MONTH_SHORT = ['янв','фев','мар','апр','мая','июн',
                     'июл','авг','сен','окт','ноя','дек'];

function dayLabel(key) {
  if (key === '—') return { full: 'Без даты', short: 'Без даты' };
  const d = new Date(key + 'T00:00:00Z');
  const day = ms => new Date(Date.now() + ms).toISOString().slice(0, 10);
  let rel = '';
  if (key === day(0))            rel = ' — сегодня';
  else if (key === day(864e5))   rel = ' — завтра';
  else if (key === day(-864e5))  rel = ' — вчера';
  const n = d.getUTCDate();
  return {
    full:  `${n} ${MONTH[d.getUTCMonth()]}${rel} · ${DOW[d.getUTCDay()]}`,
    short: `${n} ${MONTH_SHORT[d.getUTCMonth()]}${rel} · ${DOW_SHORT[d.getUTCDay()]}`,
  };
}

function delayChip(mins) {
  if (mins == null) return '';
  if (mins <= -5) return `<span class="chip early">${mins}м</span>`;
  if (mins <= 15) return `<span class="chip ok">${mins >= 0 ? '+' : ''}${mins}м</span>`;
  if (mins <= 60) return `<span class="chip warn">+${mins}м</span>`;
  return `<span class="chip bad">+${mins}м</span>`;
}

function timeCell(planned, actual, delay, isActual) {
  const p = hhmm(planned), a = hhmm(actual);
  if (!p && !a) return '<div class="tcell">—</div>';
  if (!a || a === p) return `<div class="tcell"><span class="plan">${p || '—'}</span></div>`;
  return `<div class="tcell">
            <span class="plan struck">${p || '—'}</span>
            <span class="real" title="${isActual ? 'фактическое' : 'расчётное'}">${a}</span>
            ${delayChip(delay)}
          </div>`;
}

// On a phone the three-letter code sits right above, so the qualifier in
// "Дубай (Аль-Мактум)" only costs two extra lines — drop it there.
const shortCity = s => (s || '').replace(/\s*\([^)]*\)\s*$/, '').trim() || s;

const STATE_RU = { completed:'выполнен', airborne:'в воздухе', due:'ожидает вылета', scheduled:'план' };
// A leg days in the past with no departure on record is not "waiting" any more.
const stateLabel = l => S.mode === 'history' && l.state === 'due' ? 'нет факта' : STATE_RU[l.state];

const isoDay = d => d.toISOString().slice(0, 10);
const daysAgo = n => isoDay(new Date(Date.now() - n * 864e5));

function renderTabs() {
  const hist = S.mode === 'history';
  document.getElementById('tabs').innerHTML = list().map(t => {
    const flying = !hist && !!t.now_flying;
    return `<button class="tab ${t.tail === S.active ? 'on' : ''} ${t.placeholder ? 'ghost' : ''}"
                    onclick="pick('${t.tail}')">
              <b>${flying ? '<span class="dot"></span>' : ''}${t.tail}</b>
              <i>${flightsWord(hist ? t.stats.total : t.stats.upcoming)}</i>
            </button>`;
  }).join('');
}

function renderBody() {
  const hist = S.mode === 'history';
  const t = list().find(x => x.tail === S.active);
  const box = document.getElementById('body');
  if (hist && !S.hist.loaded) { box.innerHTML = '<div class="empty">Загрузка истории…</div>'; return; }
  if (!t) { box.innerHTML = `<div class="empty">${hist ? 'За эти даты рейсов нет' : 'Нет данных'}</div>`; return; }
  if (!t.legs.length) { box.innerHTML = '<div class="empty">Для этого борта рейсов нет</div>'; return; }

  const days = [];
  t.legs.forEach(l => {
    if (!days.length || days[days.length - 1].key !== l.day) days.push({ key: l.day, legs: [] });
    days[days.length - 1].legs.push(l);
  });
  if (hist) days.reverse();      // history reads newest day first

  const thead = `<thead><tr>
      <th>Рейс</th><th>Маршрут</th><th>Вылет UTC</th><th>Прилёт UTC</th>
      <th class="hide-sm">В пути</th><th>Статус</th><th class="hide-sm">Экипаж</th>
    </tr></thead>`;

  box.innerHTML = (hist ? statsStrip(t) : '') + days.map((d, di) => {
    const rows = d.legs.map(l => {
      const crew = l.crew.length
        ? `<button class="crew" onclick="toggleCrew('${l.id}')">${l.crew.length} чел.</button>
           <div class="crewlist" id="c${l.id}">${l.crew.map(m =>
             `<div><span>${m.role}</span>${m.name}</div>`).join('')}</div>`
        : '<span class="crew none">не назначен</span>';
      return `<tr class="${l.state === 'completed' ? 'past' : ''}">
        <td class="fno">${l.flight}</td>
        <td class="route">
          <div><b>${l.origin}</b><span class="arrow">→</span><b>${l.destination}</b></div>
          <i><span class="lbl-full">${l.origin_name} → ${l.dest_name}</span
             ><span class="lbl-short">${shortCity(l.origin_city)} → ${shortCity(l.dest_city)}</span></i>
        </td>
        <td>${timeCell(l.std, l.etd, l.dep_delay, !!l.atd)}</td>
        <td>${timeCell(l.sta, l.eta, l.arr_delay, !!l.ata)}</td>
        <td class="tcell hide-sm">${dur(l.block_actual ?? l.block_planned)}</td>
        <td><span class="state ${l.state}">${stateLabel(l)}</span></td>
        <td class="hide-sm">${crew}</td>
      </tr>`;
    }).join('');

    const lbl = dayLabel(d.key);
    return `<div class="daybar">
              <h3><span class="lbl-full">${lbl.full}</span><span class="lbl-short">${lbl.short}</span></h3>
              <span>${flightsWord(d.legs.length)}</span>
            </div>
            <div class="tablewrap"><table>
              ${di === 0 ? thead : ''}
              <tbody>${rows}</tbody>
            </table></div>`;
  }).join('');
}

function statsStrip(t) {
  const st = t.stats;
  const tile = (v, l) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`;
  return `<div class="stats">
    ${tile(st.total, 'рейсов в плане')}
    ${tile(st.completed, 'выполнено')}
    ${tile(st.block_minutes ? dur(st.block_minutes) : '—', 'налёт')}
    ${tile(st.on_time_pct == null ? '—' : st.on_time_pct + '%',
           'вовремя (≤15м)' + (st.avg_dep_delay == null ? '' : ` · ср. ${st.avg_dep_delay >= 0 ? '+' : ''}${st.avg_dep_delay}м`))}
  </div>`;
}

function toggleCrew(id) { document.getElementById('c' + id).classList.toggle('open'); }
function pick(tail) { S.active = tail; renderTabs(); renderBody(); window.scrollTo(0, 0); }

/* Redraw everything for the current mode. The selected tail is kept when
   switching between plan and history, as long as it exists in both. */
function render() {
  const hist = S.mode === 'history';
  document.getElementById('m-plan').classList.toggle('on', !hist);
  document.getElementById('m-history').classList.toggle('on', hist);
  document.getElementById('hbar').hidden = !hist;
  document.getElementById('body').classList.toggle('loading', hist && S.hist.busy);

  const tails = list();
  if (!tails.some(t => t.tail === S.active) && tails.length) S.active = tails[0].tail;

  const err = hist ? S.hist.error : S.error;
  document.getElementById('err').innerHTML = !err ? ''
    : hist ? `<div class="err">Авиабит: ${err}</div>`
    : `<div class="err">Авиабит: ${err} — показаны последние загруженные данные.</div>`;

  renderTabs();
  renderBody();

  if (hist) {
    document.getElementById('h-from').value = S.hist.from || '';
    document.getElementById('h-to').value = S.hist.to || '';
    const span = S.hist.to === daysAgo(0) || S.hist.to === daysAgo(1)
      ? Math.round((Date.parse(S.hist.to) - Date.parse(S.hist.from)) / 864e5) + 1 : 0;
    document.querySelectorAll('.preset').forEach(b => b.classList.toggle('on',
      S.hist.to === daysAgo(+b.dataset.days === 1 ? 1 : 0) && +b.dataset.days === span));
    document.getElementById('sync').textContent = S.hist.loaded
      ? `История ${S.hist.from} — ${S.hist.to} · не более ${S.hist.max} дней за раз · все времена UTC` : '';
  } else {
    const when = S.updated ? new Date(S.updated * 1000) : null;
    document.getElementById('sync').textContent = when && S.window
      ? `Данные Авиабит от ${pad(when.getUTCHours())}:${pad(when.getUTCMinutes())} UTC · `
        + `окно −${S.window.days_back}/+${S.window.days_ahead} дней · все времена UTC`
      : '';
  }
}

function apply(data) {
  S.tails = data.tails || [];
  S.updated = data.updated;
  S.error = data.error;
  if (data.window) S.window = data.window;
  render();
}

/* ── history ─────────────────────────────────────────────────────────────── */
function setMode(m) {
  if (S.mode === m) return;
  S.mode = m;
  history.replaceState(null, '', m === 'history' ? '#history' : location.pathname);
  if (m === 'history' && !S.hist.loaded && !S.hist.busy) loadHistory(daysAgo(6), daysAgo(0));
  render();
  window.scrollTo(0, 0);
}

async function loadHistory(from, to, force) {
  S.hist.busy = true;
  S.hist.from = from; S.hist.to = to;
  render();
  try {
    const q = `from=${from}&to=${to}${force ? '&force=1' : ''}`;
    const r = await fetch('/api/history?' + q, { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    // ignore an answer to a range the user has already moved away from
    if (S.hist.from !== from || S.hist.to !== to) return;
    Object.assign(S.hist, { tails: d.tails || [], from: d.from, to: d.to,
                            error: d.error, max: d.max_days, loaded: true });
  } catch (e) {
    S.hist.error = `история не загрузилась (${e.message})`;
    S.hist.loaded = true;
  } finally {
    if (S.hist.from === from && S.hist.to === to) S.hist.busy = false;
    render();
  }
}

function preset(n) {
  // "Вчера" is just yesterday; the others run up to and including today
  if (n === 1) loadHistory(daysAgo(1), daysAgo(1));
  else loadHistory(daysAgo(n - 1), daysAgo(0));
}

function pickRange() {
  const f = document.getElementById('h-from').value;
  const t = document.getElementById('h-to').value;
  if (f && t) loadHistory(f <= t ? f : t, f <= t ? t : f);
}

async function load(url) {
  try { apply(await (await fetch(url, { cache: 'no-store' })).json()); }
  catch (e) {
    document.getElementById('err').innerHTML =
      `<div class="err">Сервер недоступен: ${e.message}. Следующая попытка через 2 минуты.</div>`;
  }
}

/* First load has to survive a cold start: Render spins the service down after
   15 minutes idle and the wake-up costs 30-60s, during which the edge answers
   502/503. Keep retrying and tell the user what is happening. */
async function boot() {
  const bar = document.getElementById('bootbar');
  const msg = document.getElementById('bootmsg');
  const btn = document.getElementById('bootbtn');
  const t0 = Date.now();
  btn.hidden = true;

  for (let attempt = 1; ; attempt++) {
    const secs = Math.round((Date.now() - t0) / 1000);
    bar.style.width = Math.min(96, 8 + secs * 1.5) + '%';
    msg.textContent = secs < 8   ? 'Подключение…'
                    : secs < 30  ? `Сервер просыпается… ${secs} с`
                    : secs < 75  ? `Почти готово… ${secs} с`
                    :              `Ответа нет уже ${secs} с, продолжаю…`;
    try {
      const r = await fetch('/api/timetable', { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      apply(await r.json());
      bar.style.width = '100%';
      await sleep(220);
      document.getElementById('boot').classList.add('gone');
      return;
    } catch (e) {
      if (secs > 180) { msg.textContent = 'Сервер не отвечает.'; btn.hidden = false; return; }
      await sleep(attempt < 4 ? 1500 : 3000);
    }
  }
}

async function refresh() {
  const b = document.getElementById('refresh');
  b.disabled = true; b.classList.add('spin');
  if (S.mode === 'history') await loadHistory(S.hist.from || daysAgo(6), S.hist.to || daysAgo(0), true);
  else await load('/api/refresh');
  b.disabled = false; b.classList.remove('spin');
}

clock();
setInterval(clock, 1000);
['h-from', 'h-to'].forEach(id => document.getElementById(id).max = daysAgo(0));
render();
// Opened straight on #history: wait for the server to wake, then load.
boot().then(() => {
  if (S.mode === 'history' && !S.hist.loaded && !S.hist.busy) loadHistory(daysAgo(6), daysAgo(0));
});
setInterval(() => load('/api/timetable'), 120000);
// coming back to the tab after a while should show fresh data, not stale
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && Date.now() / 1000 - S.updated > 120) load('/api/timetable');
});
</script>
</body>
</html>
